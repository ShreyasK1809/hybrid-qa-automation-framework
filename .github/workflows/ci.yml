name: QA Automation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 3 * * 1-5'      # weekdays 09:00 IST nightly regression
  workflow_dispatch:
    inputs:
      suite:
        description: 'TestNG suite file'
        default: 'testng.xml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests (headless Chrome, parallel)
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: mvn -B clean test -Dheadless=true -Dsuite.file=${{ github.event.inputs.suite || 'testng.xml' }}

      - name: Upload Extent report, logs & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/extent-reports/
            target/screenshots/
            target/logs/
            target/surefire-reports/
